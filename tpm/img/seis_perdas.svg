<svg xmlns="http://www.w3.org/2000/svg" width="900" height="517" viewBox="0 0 900 517"><rect width="100%" height="100%" rx="20" fill="#f4f7f7"/><style>text{font-family:Arial,sans-serif;fill:#142b3b}.muted{fill:#516572}.white{fill:white}.strong{font-weight:700}</style><text x="30" y="44" font-size="29" class="strong" text-anchor="start">As seis perdas e seus efeitos no OEE</text><rect x="26" y="77" width="848" height="124" rx="10" fill="white"/><rect x="26" y="77" width="10" height="124" rx="10" fill="#007d79"/><text x="55" y="110" font-size="20" class="strong" text-anchor="start">DISPONIBILIDADE</text><text x="55" y="142" font-size="24" class="" text-anchor="start">1  Quebras / avarias</text><text x="465" y="142" font-size="24" class="" text-anchor="start">2  Setup e ajustes</text><text x="55" y="178" font-size="21" class="muted" text-anchor="start">O equipamento deveria operar, mas parou.</text><rect x="26" y="218" width="848" height="124" rx="10" fill="white"/><rect x="26" y="218" width="10" height="124" rx="10" fill="#ca541c"/><text x="55" y="251" font-size="20" class="strong" text-anchor="start">DESEMPENHO</text><text x="55" y="283" font-size="24" class="" text-anchor="start">3  Pequenas paradas / vazio</text><text x="465" y="283" font-size="24" class="" text-anchor="start">4  Velocidade reduzida</text><text x="55" y="319" font-size="21" class="muted" text-anchor="start">O equipamento opera abaixo do ritmo ideal.</text><rect x="26" y="359" width="848" height="124" rx="10" fill="white"/><rect x="26" y="359" width="10" height="124" rx="10" fill="#7758a0"/><text x="55" y="392" font-size="20" class="strong" text-anchor="start">QUALIDADE</text><text x="55" y="424" font-size="24" class="" text-anchor="start">5  Defeitos e retrabalho</text><text x="465" y="424" font-size="24" class="" text-anchor="start">6  Perdas no arranque</text><text x="55" y="460" font-size="21" class="muted" text-anchor="start">Parte da produção não sai boa de primeira.</text></svg>