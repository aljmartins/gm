<svg xmlns="http://www.w3.org/2000/svg" width="840" height="490" viewBox="0 0 840 490"><rect width="100%" height="100%" rx="20" fill="#f4f7f7"/><style>text{font-family:Arial,sans-serif;fill:#142b3b}.muted{fill:#516572}.white{fill:white}.strong{font-weight:700}</style><text x="30" y="44" font-size="29" class="strong" text-anchor="start">Manutenção planejada: seis etapas</text><rect x="30" y="76" width="770" height="50" rx="10" fill="white"/><rect x="30" y="76" width="50" height="50" rx="10" fill="#142b3b"/><text x="55" y="109" font-size="24" class="white strong" text-anchor="middle">1</text><text x="99" y="109" font-size="24" class="" text-anchor="start">Avaliar equipamentos e situação atual</text><rect x="30" y="141" width="770" height="50" rx="10" fill="white"/><rect x="30" y="141" width="50" height="50" rx="10" fill="#142b3b"/><text x="55" y="174" font-size="24" class="white strong" text-anchor="middle">2</text><text x="99" y="174" font-size="24" class="" text-anchor="start">Restaurar condições ideais</text><rect x="30" y="206" width="770" height="50" rx="10" fill="white"/><rect x="30" y="206" width="50" height="50" rx="10" fill="#142b3b"/><text x="55" y="239" font-size="24" class="white strong" text-anchor="middle">3</text><text x="99" y="239" font-size="24" class="" text-anchor="start">Estruturar informações e dados</text><rect x="30" y="271" width="770" height="50" rx="10" fill="white"/><rect x="30" y="271" width="50" height="50" rx="10" fill="#142b3b"/><text x="55" y="304" font-size="24" class="white strong" text-anchor="middle">4</text><text x="99" y="304" font-size="24" class="" text-anchor="start">Organizar preventiva por tempo (TBM)</text><rect x="30" y="336" width="770" height="50" rx="10" fill="white"/><rect x="30" y="336" width="50" height="50" rx="10" fill="#142b3b"/><text x="55" y="369" font-size="24" class="white strong" text-anchor="middle">5</text><text x="99" y="369" font-size="24" class="" text-anchor="start">Organizar preditiva por condição (CBM