<svg xmlns="http://www.w3.org/2000/svg" width="910" height="494" viewBox="0 0 910 494"><rect width="100%" height="100%" rx="20" fill="#f4f7f7"/><style>text{font-family:Arial,sans-serif;fill:#142b3b}.muted{fill:#516572}.white{fill:white}.strong{font-weight:700}</style><text x="30" y="45" font-size="29" class="strong" text-anchor="start">Implantação: 12 etapas em quatro fases</text><rect x="30" y="77" width="850" height="83" rx="10" fill="white"/><rect x="30" y="77" width="125" height="83" rx="10" fill="#142b3b"/><text x="92" y="126" font-size="26" class="white strong" text-anchor="middle">01–05</text><text x="176" y="107" font-size="20" class="strong" text-anchor="start">PREPARAR</text><text x="176" y="137" font-size="20" class="muted" text-anchor="start">Direção, sensibilização, estrutura, metas e plano.</text><rect x="30" y="177" width="850" height="83" rx="10" fill="white"/><rect x="30" y="177" width="125" height="83" rx="10" fill="#007d79"/><text x="92" y="226" font-size="26" class="white strong" text-anchor="middle">06</text><text x="176" y="207" font-size="20" class="strong" text-anchor="start">INICIAR</text><text x="176" y="237" font-size="20" class="muted" text-anchor="start">Lançamento e mobilização das atividades.</text><rect x="30" y="277" width="850" height="83" rx="10" fill="white"/><rect x="30" y="277" width="125" height="83" rx="10" fill="#142b3b"/><text x="92" y="326" font-size="26" class="white strong" text-anchor="middle">07–11</text><text x="176" y="307" font-size="20" class="strong" text-anchor="start">IMPLEMENTAR</text><text x="176" y="337" font-size="20" class="muted" text-anchor="start">Melhorias, autônoma, planejada, formação e controle inicial.</text><rect x="30" y="377" width="850" height="83" rx="10" fill="white"/><rect x="30" y="377" width="125" height="83" rx="10" fill="#007d79"/><text x="92" y="426" font-size="26" class="white strong" text-anchor="middle">12</text><text x="176" y="407" font-size="20" class="strong" text-anchor="start">CONSOLIDAR</text><text x="176" y="437" font-size="20" class="muted" text-anchor="start">Sustentar resultados e elevar o nível de desempenho.</text></svg>