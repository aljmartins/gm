,sans-serif" font-size="27" fill="white" font-weight="700" text-anchor="middle">03</text><text x="117" y="335" font-family="Arial,sans-serif" font-size="25" fill="#142b3b" font-weight="700" text-anchor="start">Analisar a causa</text><text x="117" y="367" font-family="Arial,sans-serif" font-size="22" fill="#516572" font-weight="400" text-anchor="start">Investigar o evento e definir a ação</text><path d="M450 390 V408" fill="none" stroke="#007d79" stroke-width="3" marker-end="url(#arr)"/><rect x="30" y="414" width="840" height="86" rx="10" fill="white"/><rect x="30" y="414" width="66" height="86" rx="10" fill="#007d79"/><text x="63" y="465" font-family="Arial,sans-serif" font-size="27" fill="white" font-weight="700" text-anchor="middle">04</text><text x="117" y="447" font-family="Arial,sans-serif" font-size="25" fill="#142b3b" font-weight="700" text-anchor="start">Revisar e verificar</text><text x="117" y="479" font-family="Arial,sans-serif" font-size="22" fill="#516572" font-weight="400" text-anchor="start">Ajustar o plano e acompanhar a recorrência</text></svg>