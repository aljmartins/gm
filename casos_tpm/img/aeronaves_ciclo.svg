<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#007d79"/></marker></defs><rect x="0" y="0" width="900" height="530" rx="16" fill="#f4f7f7"/><text x="30" y="45" font-family="Arial,sans-serif" font-size="27" fill="#142b3b" font-weight="700" text-anchor="start">Aeronaves: ciclo da linha ≠ duração de uma revisão</text><text x="30" y="84" font-family="Arial,sans-serif" font-size="23" fill="#516572" font-weight="400" text-anchor="start">210 dias úteis/ano ÷ 7 aeronaves/ano = 30 dias por ciclo</text><rect x="35" y="130" width="105" height="72" rx="10" fill="#007d79"/><text x="87" y="160" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="middle">E1</text><text x="87" y="187" font-family="Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="middle">≤ 30 dias</text><path d="M142 165 H151" fill="none" stroke="#007d79" stroke-width="3" marker-end="url(#arr)"/><rect x="154" y="130" width="105" height="72" rx="10" fill="#007d79"/><text x="206" y="160" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="middle">E2</text><text x="206" y="187" font-family="Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="middle">≤ 30 dias</text><path d="M261 165 H270" fill="none" stroke="#007d79" stroke-width="3" marker-end="url(#arr)"/><rect x="273" y="130" width="105" height="72" rx="10" fill="#007d79"/><text x="325" y="160" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="middle">E3</text><text x="325" y="187" font-family="Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="middle">≤ 30 dias</text><path d="M380 165 H389" fill="none" stroke="#007d79" stroke-width="3" marker-end="url(#arr)"/><rect x="392" y="130" width="105" height="72" rx="10" fill="#007d79"/><text x="444" y="160" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="middle">E4</text><text x="444" y="187" font-family="Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="middle">≤ 30 dias</text><path d="M499 165 H508" fill="none" stroke="#007d79" stroke-width="3" marker-end="url(#arr)"/><rect x="511" y="130" width="105" height="72" rx="10" fill="#007d79"/><text x="563" y="160" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="middle">E5</text><text x="563" y="187" font-family="Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="middle">≤ 30 dias</text><path d="M618 165 H627" fill="none" stroke="#007d79" stroke-width="3" marker-end="url(#arr)"/><rect x="630" y="130" width="105" height="72" rx="10" fill="#007d79"/><text x="682" y="160" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="middle">E6</text><text x="682" y="187" font-family="Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="middle">≤ 30 dias</text><path d="M737 165 H746" fill="none" stroke="#007d79" stroke-width="3" marker-end="url(#arr)"/><rect x="749" y="130" width="105" height="72" rx="10" fill="#007d79"/><text x="801" y="160" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700" text-anchor="middle">E7</text><text x="801" y="187" font-family="Arial,sans-serif" font-size="17" fill="white" font-weight="400" text-anchor="middle">≤ 30 dias</text><text x="30" y="247" font-family="Arial,sans-serif" font-size="24" fill="#142b3b" font-weight="700" text-anchor="start">Uma aeronave atravessa sete estações.</text><text x="30" y="282" font-family="Arial,sans-serif" font-size="21" fill="#516572" font-weight="400" text-anchor="start">Com a linha preenchida, a proposta permite uma saída a cada 30 dias úteis.</text><rect x="35" y="320" width="818" height="91" rx="10" fill="white"/><text x="60" y="353" font-family="Arial,sans-serif" font-size="22" fill="#142b3b" font-weight="700" text-anchor="start">Itens reparáveis: revisão em paralelo às estações 2–5.</text><text x="60" y="386" font-family="Arial,sans-serif" font-size="22" fill="#516572" font-weight="400" text-anchor="start">A montagem (E6) depende da conclusão desse trabalho.</text><text x="30" y="459" font-family="Arial,sans-serif" font-size="23" fill="#142b3b" font-weight="700" text-anchor="start">Base do dimensionamento: 202 ÷ 30 = 6,73 → 7 estações.</text><text x="30" y="496" font-family="Arial,sans-serif" font-size="21" fill="#ca541c" font-weight="400" text-anchor="start">Trata-se de programação proposta/simulada no estudo.</text></svg>